server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hash-based routing (#topology, #traces, ...) means every real request is for the same
    # index.html plus static assets — no server-side rewrite needed for routes themselves,
    # only the standard SPA fallback for anything not matching a real file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
