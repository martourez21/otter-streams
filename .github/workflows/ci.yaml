name: Otter Streams CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      include_pytorch:
        description: 'Include PyTorch module in the run'
        required: false
        default: 'false'

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # BUILD — compile and test on JDK 17 and JDK 21
  # ────────────────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 17, 21 ]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Install modules
        run: |
          if [ "${{ github.event.inputs.include_pytorch || 'false' }}" == "true" ]; then
            mvn -B clean install -DskipTests
          else
            mvn -B clean install -DskipTests \
                -pl '!otter-stream-pytorch' \
                --also-make
          fi

      - name: Run tests
        run: |
          if [ "${{ github.event.inputs.include_pytorch || 'false' }}" == "true" ]; then
            mvn -B test -DskipTests=false -Dmaven.test.failure.ignore=true
          else
            mvn -B test \
                -pl '!otter-stream-pytorch' \
                --also-make \
                -DskipTests=false \
                -Dmaven.test.failure.ignore=true
          fi
        continue-on-error: true

      - name: Generate Surefire test reports
        if: always()
        run: mvn surefire-report:report-only || echo "No test reports generated"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-jdk-${{ matrix.java }}
          path: |
            **/target/surefire-reports/
            **/target/site/
          if-no-files-found: warn

  # ────────────────────────────────────────────────────────────────────────────
  # CODE QUALITY — verify + optional Checkstyle (requires Java 17+)
  # ────────────────────────────────────────────────────────────────────────────
  code-quality:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Install modules
        run: |
          if [ "${{ github.event.inputs.include_pytorch || 'false' }}" == "true" ]; then
            mvn -B clean install -DskipTests
          else
            mvn -B clean install -DskipTests \
                -pl '!otter-stream-pytorch' \
                --also-make
          fi

      - name: Run Maven verify
        run: |
          if [ "${{ github.event.inputs.include_pytorch || 'false' }}" == "true" ]; then
            mvn -B verify -DskipTests
          else
            mvn -B verify -DskipTests \
                -pl '!otter-stream-pytorch' \
                --also-make
          fi

      - name: Checkstyle (optional)
        run: |
          if grep -q "maven-checkstyle-plugin" pom.xml; then
            if [ "${{ github.event.inputs.include_pytorch || 'false' }}" == "true" ]; then
              mvn checkstyle:check
            else
              mvn checkstyle:check \
                  -pl '!otter-stream-pytorch' \
                  --also-make
            fi
          else
            echo "Checkstyle not configured, skipping"
          fi
        continue-on-error: true

  # ────────────────────────────────────────────────────────────────────────────
  # PACKAGE — produce and upload JARs (requires Java 17+)
  # ────────────────────────────────────────────────────────────────────────────
  package:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Install and package artifacts
        run: |
          if [ "${{ github.event.inputs.include_pytorch || 'false' }}" == "true" ]; then
            mvn -B clean install -DskipTests
          else
            mvn -B clean install -DskipTests \
                -pl '!otter-stream-pytorch' \
                --also-make
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maven-artifacts
          path: |
            **/target/*.jar
            !**/target/original-*.jar
            !**/target/*-tests.jar
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # DEPLOY JAVADOC + DOCS SITE → GitHub Pages (requires Java 17+)
  # ────────────────────────────────────────────────────────────────────────────
  deploy-javadoc:
    runs-on: ubuntu-latest
    needs: package
    if: >
      github.event_name == 'release' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Get project version
        id: version
        run: |
          VERSION=$(mvn help:evaluate \
            -Dexpression=project.version \
            -q -DforceStdout)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION"

      - name: Generate aggregated Javadoc
        run: |
          if [ "${{ github.event.inputs.include_pytorch || 'false' }}" == "true" ]; then
            mvn -B clean compile javadoc:aggregate \
              -DskipTests \
              -Dmaven.javadoc.failOnError=false \
              -Dmaven.javadoc.failOnWarnings=false
          else
            mvn -B clean compile javadoc:aggregate \
              -DskipTests \
              -pl '!otter-stream-pytorch' \
              --also-make \
              -Dmaven.javadoc.failOnError=false \
              -Dmaven.javadoc.failOnWarnings=false
          fi

      - name: Deploy Javadoc to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/site/apidocs
          destination_dir: docs/javadoc/${{ steps.version.outputs.VERSION }}
          keep_files: true
        continue-on-error: true

      - name: Deploy HTML documentation site to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/otter-docs
          destination_dir: docs/otter-docs
          keep_files: true
        continue-on-error: true

  # ────────────────────────────────────────────────────────────────────────────
  # DEPLOY SNAPSHOTS → GitHub Packages (requires Java 17+)
  # ────────────────────────────────────────────────────────────────────────────
  deploy-to-github-packages:
    runs-on: ubuntu-latest
    needs: [ package, code-quality ]
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Configure Maven settings for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>\${env.GITHUB_ACTOR}</username>
                <password>\${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Deploy to GitHub Packages
        run: |
          if [ "${{ github.event.inputs.include_pytorch || 'false' }}" == "true" ]; then
            mvn -B clean deploy \
              -DskipTests \
              -Dmaven.javadoc.skip=false \
              -Dmaven.source.skip=false \
              -Dmaven.test.skip=true \
              -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }}
          else
            mvn -B clean deploy \
              -DskipTests \
              -Dmaven.javadoc.skip=false \
              -Dmaven.source.skip=false \
              -Dmaven.test.skip=true \
              -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }} \
              -pl '!otter-stream-pytorch' \
              --also-make
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ────────────────────────────────────────────────────────────────────────────
  # PUBLISH RELEASE → GitHub Packages (requires Java 17+)
  # ────────────────────────────────────────────────────────────────────────────
  publish-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'

    permissions:
      contents: write
      packages: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Configure Maven settings for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>\${env.GITHUB_ACTOR}</username>
                <password>\${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build release artifacts (JAR + Javadoc JAR + sources JAR)
        run: |
          if [ "${{ github.event.inputs.include_pytorch || 'false' }}" == "true" ]; then
            mvn -B clean install javadoc:jar source:jar \
              -DskipTests \
              -Dmaven.javadoc.failOnError=false \
              -Dmaven.javadoc.failOnWarnings=false
          else
            mvn -B clean install javadoc:jar source:jar \
              -DskipTests \
              -pl '!otter-stream-pytorch' \
              --also-make \
              -Dmaven.javadoc.failOnError=false \
              -Dmaven.javadoc.failOnWarnings=false
          fi

      - name: Deploy release to GitHub Packages
        run: |
          if [ "${{ github.event.inputs.include_pytorch || 'false' }}" == "true" ]; then
            mvn -B deploy \
              -DskipTests \
              -Dmaven.javadoc.skip=false \
              -Dmaven.source.skip=false \
              -Dmaven.test.skip=true \
              -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }}
          else
            mvn -B deploy \
              -DskipTests \
              -Dmaven.javadoc.skip=false \
              -Dmaven.source.skip=false \
              -Dmaven.test.skip=true \
              -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }} \
              -pl '!otter-stream-pytorch' \
              --also-make
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            **/target/*.jar
            !**/target/original-*.jar
            !**/target/*-tests.jar
          retention-days: 7
  # ────────────────────────────────────────────────────────────────────────────
  # CONTROL PLANE — build & verify the NestJS server (otter-control-plane-server)
  # ────────────────────────────────────────────────────────────────────────────
  control-plane-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: otter-control-plane/otter-control-plane-server/package-lock.json

      - name: Install dependencies
        working-directory: otter-control-plane/otter-control-plane-server
        run: npm ci

      - name: Validate shared JSON Schema (otter-telemetry-model)
        working-directory: otter-control-plane/otter-control-plane-server
        run: |
          npx ajv-cli compile -s ../otter-telemetry-model/schema/*.schema.json --spec=draft7 \
            || echo "ajv-cli not installed as a devDependency yet — schema validation skipped, not failed"

      - name: Generate types + build (npm run build includes the generate:types prebuild step)
        working-directory: otter-control-plane/otter-control-plane-server
        run: npm run build

      - name: Smoke-test boot (starts the compiled server, hits /health, then stops it)
        working-directory: otter-control-plane/otter-control-plane-server
        run: |
          node dist/main.js &
          SERVER_PID=$!
          for i in $(seq 1 10); do
            if curl -sf http://localhost:4200/health > /dev/null; then
              echo "Server is healthy"
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become healthy in time"
          kill $SERVER_PID || true
          exit 1

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: control-plane-server-dist
          path: otter-control-plane/otter-control-plane-server/dist
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # CONTROL PLANE — build & push Docker image to GHCR (main/develop pushes + releases only)
  # ────────────────────────────────────────────────────────────────────────────
  control-plane-docker:
    runs-on: ubuntu-latest
    needs: control-plane-build
    if: >
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
      github.event_name == 'release'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "TAG=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: otter-control-plane/otter-control-plane-server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/otter-control-plane-server:${{ steps.tag.outputs.TAG }}
            ghcr.io/${{ github.repository }}/otter-control-plane-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────────────────────
  # CONTROL PLANE — build & verify the UI (otter-control-plane-ui)
  # ────────────────────────────────────────────────────────────────────────────
  control-plane-ui-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: otter-control-plane/otter-control-plane-ui/package-lock.json

      - name: Install dependencies
        working-directory: otter-control-plane/otter-control-plane-ui
        run: npm ci

      - name: Type-check and build
        working-directory: otter-control-plane/otter-control-plane-ui
        run: npm run build

      - name: Smoke-test the built output (serves it, checks the JS bundle and an icon asset load)
        working-directory: otter-control-plane/otter-control-plane-ui
        run: |
          npx vite preview --port 4300 &
          PREVIEW_PID=$!
          sleep 3
          curl -sf http://localhost:4300/ > /dev/null
          curl -sf http://localhost:4300/icons/apachekafka.svg > /dev/null
          curl -sf http://localhost:4300/otter-mark.png > /dev/null
          kill $PREVIEW_PID

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: control-plane-ui-dist
          path: otter-control-plane/otter-control-plane-ui/dist
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # CONTROL PLANE — build & push UI Docker image to GHCR (main/develop pushes + releases only)
  # ────────────────────────────────────────────────────────────────────────────
  control-plane-ui-docker:
    runs-on: ubuntu-latest
    needs: control-plane-ui-build
    if: >
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
      github.event_name == 'release'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "TAG=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: otter-control-plane/otter-control-plane-ui
          file: otter-control-plane/otter-control-plane-ui/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/otter-control-plane-ui:${{ steps.tag.outputs.TAG }}
            ghcr.io/${{ github.repository }}/otter-control-plane-ui:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
