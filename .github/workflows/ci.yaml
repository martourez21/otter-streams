name: Otter Streams CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      include_pytorch:
        description: 'Include PyTorch module in the run'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [11, 17]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      # Install modules excluding PyTorch unless workflow input is true
      - name: Install modules
        run: |
          if [ "${{ github.event.inputs.include_pytorch }}" == "true" ]; then
            mvn -B clean install -DskipTests
          else
            mvn -B clean install -DskipTests -pl \!otter-stream-pytorch
          fi

      # Run tests
      - name: Run tests
        run: |
          if [ "${{ github.event.inputs.include_pytorch }}" == "true" ]; then
            mvn -B test -DskipTests=false -Dmaven.test.failure.ignore=true
          else
            mvn -B test -pl \!otter-stream-pytorch -DskipTests=false -Dmaven.test.failure.ignore=true
          fi
        continue-on-error: true

      - name: Generate Surefire test reports
        if: always()
        run: mvn surefire-report:report-only || echo "No test reports generated"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-jdk-${{ matrix.java }}
          path: |
            **/target/surefire-reports/
            **/target/site/
          if-no-files-found: warn

  code-quality:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: temurin
          cache: maven

      - name: Install modules
        run: |
          if [ "${{ github.event.inputs.include_pytorch }}" == "true" ]; then
            mvn -B clean install -DskipTests
          else
            mvn -B clean install -DskipTests -pl \!otter-stream-pytorch
          fi

      - name: Run Maven verify
        run: |
          if [ "${{ github.event.inputs.include_pytorch }}" == "true" ]; then
            mvn -B verify -DskipTests
          else
            mvn -B verify -DskipTests -pl \!otter-stream-pytorch
          fi

      - name: Checkstyle (optional)
        run: |
          if grep -q "maven-checkstyle-plugin" pom.xml; then
            if [ "${{ github.event.inputs.include_pytorch }}" == "true" ]; then
              mvn checkstyle:check
            else
              mvn checkstyle:check -pl \!otter-stream-pytorch
            fi
          else
            echo "Checkstyle not configured, skipping"
          fi
        continue-on-error: true

  package:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: temurin
          cache: maven

      - name: Install and package artifacts
        run: |
          if [ "${{ github.event.inputs.include_pytorch }}" == "true" ]; then
            mvn -B clean install -DskipTests
          else
            mvn -B clean install -DskipTests -pl \!otter-stream-pytorch
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maven-artifacts
          path: |
            **/target/*.jar
            !**/target/original-*.jar
            !**/target/*-tests.jar
          retention-days: 7

  deploy-javadoc:
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: temurin
          cache: maven

      - name: Get project version
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<version>)[^<]+' pom.xml | head -1)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate Javadoc
        run: |
          if [ "${{ github.event.inputs.include_pytorch }}" == "true" ]; then
            mvn -B clean compile javadoc:aggregate -DskipTests -Dmaven.javadoc.failOnError=false -Dmaven.javadoc.failOnWarnings=false
          else
            mvn -B clean compile javadoc:aggregate -DskipTests -pl \!otter-stream-pytorch -Dmaven.javadoc.failOnError=false -Dmaven.javadoc.failOnWarnings=false
          fi

      - name: Deploy Javadoc to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/site/apidocs
          destination_dir: javadoc/${{ steps.version.outputs.VERSION }}
          keep_files: true
        continue-on-error: true

  publish-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      contents: write
      packages: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: temurin
          cache: maven

      - name: Configure Maven for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>\${env.GITHUB_ACTOR}</username>
                <password>\${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build release artifacts
        run: |
          if [ "${{ github.event.inputs.include_pytorch }}" == "true" ]; then
            mvn -B clean install javadoc:jar source:jar -DskipTests -Dmaven.javadoc.failOnError=false -Dmaven.javadoc.failOnWarnings=false
          else
            mvn -B clean install javadoc:jar source:jar -DskipTests -pl \!otter-stream-pytorch -Dmaven.javadoc.failOnError=false -Dmaven.javadoc.failOnWarnings=false
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            **/target/*.jar
            !**/target/original-*.jar
            !**/target/*-tests.jar
          retention-days: 7
