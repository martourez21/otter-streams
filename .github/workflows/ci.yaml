name: Otter Streams CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      include_pytorch:
        description: 'Include PyTorch module in the run'
        required: false
        default: 'false'

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # BUILD — compile and test on JDK 11 and JDK 17
  # ────────────────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 11, 17 ]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Install modules
        run: |
          if [ "${{ github.event.inputs.include_pytorch || 'false' }}" == "true" ]; then
            mvn -B clean install -DskipTests
          else
            # --also-make ensures the parent POM and all upstream dependencies
            # are installed into the local cache before the selected modules are
            # built. Without it, Maven cannot resolve the parent locally and
            # falls back to remote repositories, causing a resolution failure.
            mvn -B clean install -DskipTests \
                -pl '!otter-stream-pytorch' \
                --also-make
          fi

      - name: Run tests
        run: |
          if [ "${{ github.event.inputs.include_pytorch || 'false' }}" == "true" ]; then
            mvn -B test -DskipTests=false -Dmaven.test.failure.ignore=true
          else
            mvn -B test \
                -pl '!otter-stream-pytorch' \
                --also-make \
                -DskipTests=false \
                -Dmaven.test.failure.ignore=true
          fi
        continue-on-error: true

      - name: Generate Surefire test reports
        if: always()
        run: mvn surefire-report:report-only || echo "No test reports generated"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-jdk-${{ matrix.java }}
          path: |
            **/target/surefire-reports/
            **/target/site/
          if-no-files-found: warn

  # ────────────────────────────────────────────────────────────────────────────
  # CODE QUALITY — verify + optional Checkstyle
  # ────────────────────────────────────────────────────────────────────────────
  code-quality:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: temurin
          cache: maven

      - name: Install modules
        run: |
          if [ "${{ github.event.inputs.include_pytorch || 'false' }}" == "true" ]; then
            mvn -B clean install -DskipTests
          else
            mvn -B clean install -DskipTests \
                -pl '!otter-stream-pytorch' \
                --also-make
          fi

      - name: Run Maven verify
        run: |
          if [ "${{ github.event.inputs.include_pytorch || 'false' }}" == "true" ]; then
            mvn -B verify -DskipTests
          else
            mvn -B verify -DskipTests \
                -pl '!otter-stream-pytorch' \
                --also-make
          fi

      - name: Checkstyle (optional)
        run: |
          if grep -q "maven-checkstyle-plugin" pom.xml; then
            if [ "${{ github.event.inputs.include_pytorch || 'false' }}" == "true" ]; then
              mvn checkstyle:check
            else
              mvn checkstyle:check \
                  -pl '!otter-stream-pytorch' \
                  --also-make
            fi
          else
            echo "Checkstyle not configured, skipping"
          fi
        continue-on-error: true

  # ────────────────────────────────────────────────────────────────────────────
  # PACKAGE — produce and upload JARs
  # ────────────────────────────────────────────────────────────────────────────
  package:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: temurin
          cache: maven

      - name: Install and package artifacts
        run: |
          if [ "${{ github.event.inputs.include_pytorch || 'false' }}" == "true" ]; then
            mvn -B clean install -DskipTests
          else
            mvn -B clean install -DskipTests \
                -pl '!otter-stream-pytorch' \
                --also-make
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maven-artifacts
          path: |
            **/target/*.jar
            !**/target/original-*.jar
            !**/target/*-tests.jar
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # DEPLOY JAVADOC + DOCS SITE → GitHub Pages
  # ────────────────────────────────────────────────────────────────────────────
  deploy-javadoc:
    runs-on: ubuntu-latest
    needs: package
    # Only publish from main branch or on a release event
    if: >
      github.event_name == 'release' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')

    permissions:
      contents: write   # required by peaceiris/actions-gh-pages

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: temurin
          cache: maven

      # Use mvn help:evaluate instead of grep — always picks up the correct
      # <version> from the POM regardless of how the file is structured.
      - name: Get project version
        id: version
        run: |
          VERSION=$(mvn help:evaluate \
            -Dexpression=project.version \
            -q -DforceStdout)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION"

      - name: Generate aggregated Javadoc
        run: |
          if [ "${{ github.event.inputs.include_pytorch || 'false' }}" == "true" ]; then
            mvn -B clean compile javadoc:aggregate \
              -DskipTests \
              -Dmaven.javadoc.failOnError=false \
              -Dmaven.javadoc.failOnWarnings=false
          else
            mvn -B clean compile javadoc:aggregate \
              -DskipTests \
              -pl '!otter-stream-pytorch' \
              --also-make \
              -Dmaven.javadoc.failOnError=false \
              -Dmaven.javadoc.failOnWarnings=false
          fi

      # Publish the aggregated Javadoc to  /docs/javadoc/<version>/  on gh-pages.
      # Both outputs live inside docs/ so the entire site is rooted there.
      - name: Deploy Javadoc to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/site/apidocs
          destination_dir: docs/javadoc/${{ steps.version.outputs.VERSION }}
          keep_files: true
        continue-on-error: true

      # Publish the HTML documentation site to  /docs/otter-docs/  on gh-pages.
      # keep_files: true ensures the Javadoc deployed above is not overwritten.
      - name: Deploy HTML documentation site to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/otter-docs
          destination_dir: docs/otter-docs
          keep_files: true
        continue-on-error: true

  # ────────────────────────────────────────────────────────────────────────────
  # DEPLOY SNAPSHOTS → GitHub Packages  (push to main or develop only)
  # ────────────────────────────────────────────────────────────────────────────
  deploy-to-github-packages:
    runs-on: ubuntu-latest
    needs: [ package, code-quality ]
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: temurin
          cache: maven

      - name: Configure Maven settings for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>\${env.GITHUB_ACTOR}</username>
                <password>\${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Deploy to GitHub Packages
        run: |
          if [ "${{ github.event.inputs.include_pytorch || 'false' }}" == "true" ]; then
            mvn -B clean deploy \
              -DskipTests \
              -Dmaven.javadoc.skip=false \
              -Dmaven.source.skip=false \
              -Dmaven.test.skip=true \
              -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }}
          else
            mvn -B clean deploy \
              -DskipTests \
              -Dmaven.javadoc.skip=false \
              -Dmaven.source.skip=false \
              -Dmaven.test.skip=true \
              -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }} \
              -pl '!otter-stream-pytorch' \
              --also-make
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ────────────────────────────────────────────────────────────────────────────
  # PUBLISH RELEASE → GitHub Packages  (triggered by a published release only)
  # ────────────────────────────────────────────────────────────────────────────
  publish-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'

    permissions:
      contents: write
      packages: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: temurin
          cache: maven

      - name: Configure Maven settings for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>\${env.GITHUB_ACTOR}</username>
                <password>\${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build release artifacts (JAR + Javadoc JAR + sources JAR)
        run: |
          if [ "${{ github.event.inputs.include_pytorch || 'false' }}" == "true" ]; then
            mvn -B clean install javadoc:jar source:jar \
              -DskipTests \
              -Dmaven.javadoc.failOnError=false \
              -Dmaven.javadoc.failOnWarnings=false
          else
            mvn -B clean install javadoc:jar source:jar \
              -DskipTests \
              -pl '!otter-stream-pytorch' \
              --also-make \
              -Dmaven.javadoc.failOnError=false \
              -Dmaven.javadoc.failOnWarnings=false
          fi

      - name: Deploy release to GitHub Packages
        run: |
          if [ "${{ github.event.inputs.include_pytorch || 'false' }}" == "true" ]; then
            mvn -B deploy \
              -DskipTests \
              -Dmaven.javadoc.skip=false \
              -Dmaven.source.skip=false \
              -Dmaven.test.skip=true \
              -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }}
          else
            mvn -B deploy \
              -DskipTests \
              -Dmaven.javadoc.skip=false \
              -Dmaven.source.skip=false \
              -Dmaven.test.skip=true \
              -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }} \
              -pl '!otter-stream-pytorch' \
              --also-make
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            **/target/*.jar
            !**/target/original-*.jar
            !**/target/*-tests.jar
          retention-days: 7