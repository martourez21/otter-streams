name: Otter Streams CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      rerun_all:
        description: 'Rerun all jobs, ignoring docs-only'
        required: false
        default: 'false'

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.filter.outputs.docs-only }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for docs-only changes
        id: filter
        run: |
          if [ "${{ github.event.inputs.rerun_all }}" == "true" ]; then
            echo "docs-only=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD || echo "")
          NON_DOCS=$(echo "$CHANGED_FILES" | grep -v -E '\.(md|html|png|jpg|jpeg|yml|yaml)$' | grep -v '^docs/' | grep -v '^assets/' | grep -v '^\.github/workflows/templates/' || true)
          if [ -z "$NON_DOCS" ]; then
            echo "docs-only=true" >> $GITHUB_OUTPUT
          else
            echo "docs-only=false" >> $GITHUB_OUTPUT
          fi

  build:
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.docs-only == 'false'
    strategy:
      matrix:
        java: [11, 17]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Install modules to local repo (skip PyTorch)
        run: mvn -B clean install -DskipTests -pl \!otter-stream-pytorch

      - name: Run tests (skip PyTorch)
        run: |
          mvn -B test -pl \!otter-stream-pytorch -DskipTests=false -Dmaven.test.failure.ignore=true
        continue-on-error: true

      - name: Generate Surefire test reports
        if: always()
        run: mvn surefire-report:report-only || echo "No test reports generated"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-jdk-${{ matrix.java }}
          path: |
            **/target/surefire-reports/
            **/target/site/
          if-no-files-found: warn

  code-quality:
    runs-on: ubuntu-latest
    needs: build
    if: needs.check-changes.outputs.docs-only == 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: temurin
          cache: maven

      - name: Install modules (skip PyTorch)
        run: mvn -B clean install -DskipTests -pl \!otter-stream-pytorch

      - name: Run Maven verify (skip PyTorch)
        run: mvn -B verify -DskipTests -pl \!otter-stream-pytorch

      - name: Checkstyle (optional)
        run: |
          if grep -q "maven-checkstyle-plugin" pom.xml; then
            mvn checkstyle:check -pl \!otter-stream-pytorch
          else
            echo "Checkstyle not configured, skipping"
          fi
        continue-on-error: true

  package:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && needs.check-changes.outputs.docs-only == 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: temurin
          cache: maven

      - name: Install and package artifacts (skip PyTorch)
        run: mvn -B clean install -DskipTests -pl \!otter-stream-pytorch

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maven-artifacts
          path: |
            **/target/*.jar
            !**/target/original-*.jar
            !**/target/*-tests.jar
          retention-days: 7

  deploy-javadoc:
    runs-on: ubuntu-latest
    needs: package
    if: needs.check-changes.outputs.docs-only == 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: temurin
          cache: maven

      - name: Get project version
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<version>)[^<]+' pom.xml | head -1)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate Javadoc (skip PyTorch)
        run: mvn -B clean compile javadoc:aggregate -DskipTests -pl \!otter-stream-pytorch -Dmaven.javadoc.failOnError=false -Dmaven.javadoc.failOnWarnings=false

      - name: Deploy Javadoc to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/site/apidocs
          destination_dir: javadoc/${{ steps.version.outputs.VERSION }}
          keep_files: true
        continue-on-error: true

  publish-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      contents: write
      packages: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: temurin
          cache: maven

      - name: Configure Maven for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>\${env.GITHUB_ACTOR}</username>
                <password>\${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build release artifacts (skip PyTorch)
        run: mvn -B clean install javadoc:jar source:jar -DskipTests -pl \!otter-stream-pytorch -Dmaven.javadoc.failOnError=false -Dmaven.javadoc.failOnWarnings=false

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            **/target/*.jar
            !**/target/original-*.jar
            !**/target/*-tests.jar
          retention-days: 7
